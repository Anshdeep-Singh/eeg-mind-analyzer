<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="eegGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Brain Hemisphere Folds (Left - Cyan/Teal) -->
  <g stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <path d="M 231 116 C 181 111 116 156 101 221" />
    <path d="M 231 171 C 166 166 111 206 126 276" />
    <path d="M 231 231 C 171 251 116 281 151 341" />
    <path d="M 231 291 C 181 311 161 346 161 346" />
  </g>

  <!-- Brain Hemisphere Folds (Right - Purple) -->
  <g stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <path d="M 281 116 C 331 111 396 156 411 221" />
    <path d="M 281 171 C 346 166 401 206 386 276" />
    <path d="M 281 231 C 341 251 396 281 361 341" />
    <path d="M 281 291 C 331 311 351 346 351 346" />
  </g>

  <!-- Center Fissure -->
  <line x1="256" y1="106" x2="256" y2="326" stroke="#38bdf8" stroke-width="6" stroke-dasharray="12 8" opacity="0.8" />

  <!-- Synapse / Neural Nodes -->
  <g fill="#ffffff" stroke="#38bdf8" stroke-width="3">
    <circle cx="116" cy="156" r="8" />
    <circle cx="101" cy="221" r="8" fill="#2dd4bf" />
    <circle cx="166" cy="166" r="8" />
    <circle cx="126" cy="276" r="8" fill="#2dd4bf" />
    <circle cx="151" cy="341" r="8" />
    
    <circle cx="396" cy="156" r="8" stroke="#a855f7" />
    <circle cx="411" cy="221" r="8" fill="#c084fc" stroke="#a855f7" />
    <circle cx="346" cy="166" r="8" stroke="#a855f7" />
    <circle cx="386" cy="276" r="8" fill="#c084fc" stroke="#a855f7" />
    <circle cx="361" cy="341" r="8" stroke="#a855f7" />

    <circle cx="256" cy="121" r="7" fill="#ffffff" />
    <circle cx="256" cy="201" r="7" fill="#ffffff" />
    <circle cx="256" cy="281" r="7" fill="#ffffff" />
  </g>

  <!-- Overlay EEG Signal Wave -->
  <path d="M 66 371 L 126 371 L 156 356 L 176 381 L 206 311 L 236 411 L 266 351 L 296 381 L 336 326 L 366 396 L 396 371 L 446 371" 
        fill="none" 
        stroke="url(#eegGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <path d="M 66 371 L 126 371 L 156 356 L 176 381 L 206 311 L 236 411 L 266 351 L 296 381 L 336 326 L 366 396 L 396 371 L 446 371" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- EEG Wave Peak Dots -->
  <circle cx="206" cy="311" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="3" />
  <circle cx="336" cy="326" r="7" fill="#ffffff" stroke="#a855f7" stroke-width="3" />
</svg>
